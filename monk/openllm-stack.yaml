namespace: openllm

stack-web:
  defines: runnable
  inherits: openllm/base

  metadata:
    name: OpenLLM Stack Web
    description: |
      Production-intended OpenLLM web/API runnable. It exposes the HTTP service
      only through Monk ingress and avoids mandatory secrets. For gated models,
      inherit this runnable, permit hf-token, and set hf-token to
      secret("hf-token"). Set runtime-mode to serve on GPU capacity for real
      model inference.
    tags: openllm, llm, standalone, production, ingress

  variables:
    runtime-mode:
      type: string
      value: smoke
      env: OPENLLM_RUNTIME_MODE
      description: Default smoke mode supports local readiness checks; production inheritors should set serve on GPU-backed clusters.
    model:
      type: string
      value: qwen2.5-coder:3b
      env: OPENLLM_MODEL
      description: Public OpenLLM catalog model intended for GPU-backed serve mode.
    data-volume-name:
      type: string
      value: openllm-stack
      description: Monk volume subdirectory used by the production stack runtime.

  services:
    http:
      container: server
      port: <- $port
      protocol: tcp
      ingress-routes:
        api:
          path-prefix: /
      description: OpenLLM HTTP API exposed by Monk ingress for production deployments.

stack:
  defines: process-group

  metadata:
    name: OpenLLM Standalone Stack
    description: Production-oriented standalone OpenLLM stack using Monk ingress for HTTP exposure and no default sensitive values.
    tags: openllm, llm, standalone, production

  runnable-list:
    - openllm/stack-web

stack-local-web:
  defines: runnable
  inherits: openllm/base

  metadata:
    name: OpenLLM Stack Local Web
    description: Local verification flavor of the standalone OpenLLM stack. It publishes a non-privileged host port because Monk ingress does not work on local targets.
    tags: openllm, llm, standalone, local

  variables:
    runtime-mode:
      type: string
      value: smoke
      env: OPENLLM_RUNTIME_MODE
      description: Keeps the local stack flavor verifiable without GPU hardware; set to serve on GPU hosts for real model serving.
    model:
      type: string
      value: qwen2.5-coder:3b
      env: OPENLLM_MODEL
      description: Public OpenLLM catalog model intended for GPU-backed serve mode and reported by smoke mode.
    data-volume-name:
      type: string
      value: openllm-stack-local
      description: Monk volume subdirectory used by the local stack flavor.
    host-port:
      type: int
      value: 30181
      description: Non-privileged local host port published by the local standalone flavor.

  services:
    http:
      container: server
      port: <- $port
      protocol: tcp
      publish: true
      host-port: <- $host-port
      description: Published local HTTP service for standalone stack verification.

stack-local:
  defines: process-group

  metadata:
    name: OpenLLM Standalone Stack Local
    description: Local deployment flavor of the standalone OpenLLM stack with a published HTTP port for external verification.
    tags: openllm, llm, standalone, local

  runnable-list:
    - openllm/stack-local-web
